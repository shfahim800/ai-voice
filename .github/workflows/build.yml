name: Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # v4 থেকে লেটেস্ট v5 বা লেটেস্ট ভার্সনে আপডেট
      - name: Checkout Code
        uses: actions/checkout@v5

      # setup-java v4 এর জায়গায় v5 ব্যবহার করুন
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # setup-android অ্যাকশন আপডেট করুন
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Node.js এনভায়রনমেন্ট সেটআপ (Node 24 বা লেটেস্ট ব্যবহার করতে)
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
