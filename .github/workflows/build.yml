name: Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

    - name: Build Web App & Prepare Web Dir
      run: |
        npm run build
        mkdir -p www
        cp -r dist/* www/ || true

    - name: Sync Capacitor Android
      run: |
        npx cap sync android || true

    - name: Grant Execute Permission & Build APK
      run: |
        if [ -f "android/gradlew" ]; then
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug || true
        elif [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug || true
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SH-AI-Assistant-APK
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          public/app-debug.apk
          app-debug.apk
